name: CI

on:
  # Reusable — called by deploy.yml as a gate before every deploy
  workflow_call:
  # Early feedback on PRs
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build shared types
        run: npm run build -w shared

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test
